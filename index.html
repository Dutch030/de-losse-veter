<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventarisatie Wandelvakantie 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1310;
      --surface: #141d18;
      --surface-border: #233229;
      --surface-hover: #1b2721;
      --input-bg: #090e0b;
      
      --primary: #3d8b5e;
      --primary-light: #52a875;
      --accent: #d97736;
      
      --text-main: #f0f4f1;
      --text-muted: #8fa396;
      --text-dim: #5c6e62;
      
      --radius-s: 6px;
      --radius-m: 10px;
      --radius-l: 16px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 0 0 3rem 0;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Hero Banner met Afbeelding */
    .hero-banner {
      position: relative;
      height: 260px;
      border-radius: 0 0 var(--radius-l) var(--radius-l);
      overflow: hidden;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--surface-border);
      background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center 40%;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13, 19, 16, 0.4) 0%, rgba(13, 19, 16, 0.95) 100%);
      display: flex;
      align-items: flex-end;
      padding: 2rem 1.5rem;
    }

    .hero-content {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary-light);
      background: rgba(61, 139, 94, 0.25);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-s);
      margin-bottom: 0.6rem;
      border: 1px solid rgba(82, 168, 117, 0.3);
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .hero-content p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    /* Card Layout */
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-l);
      padding: 2rem;
      margin-bottom: 1.75rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Form controls */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label.field-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    .field-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-m);
      padding: 0.75rem 0.9rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      transition: var(--transition);
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: var(--text-dim);
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(61, 139, 94, 0.2);
    }

    /* Option pills (Radio & Checkbox) */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.6rem;
      margin-top: 0.4rem;
    }

    .option-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-m);
      cursor: pointer;
      font-size: 0.88rem;
      color: var(--text-muted);
      transition: var(--transition);
      user-select: none;
    }

    .option-pill:hover {
      background: var(--surface-hover);
      color: var(--text-main);
      border-color: var(--text-dim);
    }

    .option-pill input {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
    }

    /* Active state styling */
    .option-pill:has(input:checked) {
      background: rgba(61, 139, 94, 0.12);
      border-color: var(--primary);
      color: var(--text-main);
      font-weight: 500;
    }

    /* Submit Button */
    button[type="submit"] {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-m);
      padding: 0.9rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    button[type="submit"]:hover {
      background: var(--primary-light);
    }

    button[type="submit"]:active {
      transform: translateY(1px);
    }

    @media (max-width: 600px) {
      .hero-banner {
        height: 220px;
      }
      .hero-overlay {
        padding: 1.25rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 1.4rem;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HERO MET AFBEELDING -->
  <div class="hero-banner">
    <div class="hero-overlay">
      <div class="hero-content container">
        <span class="tag">Wandelclub 'De Losse Veter'</span>
        <h1>Inventarisatie Wandelvakantie 2027</h1>
        <p>Korte uitvraag van wensen en kaders om geschikte routes en locaties voor te bereiden.</p>
      </div>
    </div>
  </div>

  <div class="container">

    <form action="https://formspree.io/f/mdeaegao" method="POST">
    <!-- GOTCHA -->
    <input type="text" name="_gotcha" style="display:none !important" tabindex="-1" autocomplete="off">
      <!-- SECTIE 1 -->
      <div class="card">
        <h2 class="card-title">1. Algemeen & Beschikbaarheid</h2>
        
        <div class="form-group">
          <label class="field-label" for="naam">Naam *</label>
          <input type="text" id="naam" name="Naam" required placeholder="Je naam">
        </div>

        <div class="form-group">
          <label class="field-label">Ga je mee in 2027? *</label>
          <div class="options-grid">
            <label class="option-pill"><input type="radio" name="Mee in 2027" value="Ja" required> Ja</label>
            <label class="option-pill"><input type="radio" name="Mee in 2027" value="Waarschijnlijk wel"> Waarschijnlijk wel</label>
            <label class="option-pill"><input type="radio" name="Mee in 2027" value="Afhankelijk van datum/locatie"> Afhankelijk van datum/locatie</label>
            <label class="option-pill"><input type="radio" name="Mee in 2027" value="Nee"> Nee</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">Voorkeur voor seizoen/periode</label>
          <div class="options-grid">
            <label class="option-pill"><input type="checkbox" name="Periode[]" value="Q1 (Jan-Mrt)"> Q1 (Jan - Mrt)</label>
            <label class="option-pill"><input type="checkbox" name="Periode[]" value="Q2 (Apr-Jun)"> Q2 (Apr - Jun)</label>
            <label class="option-pill"><input type="checkbox" name="Periode[]" value="Q3 (Jul-Sep)"> Q3 (Jul - Sep)</label>
            <label class="option-pill"><input type="checkbox" name="Periode[]" value="Q4 (Okt-Dec)"> Q4 (Okt - Dec)</label>
          </div>
        </div>
      </div>

      <!-- SECTIE 2 -->
      <div class="card">
        <h2 class="card-title">2. Duur & Intensiteit</h2>

        <div class="form-group">
          <label class="field-label" for="duur">Gewenste duur van de trip</label>
          <select id="duur" name="Gewenste Duur">
            <option value="3-4 dagen (Lang weekend)">3 - 4 dagen (Lang weekend)</option>
            <option value="5-7 dagen (Midweek of week)">5 - 7 dagen (Midweek of week)</option>
            <option value="7+ dagen">Langer dan 1 week</option>
            <option value="Maakt niet uit">Maakt niet uit</option>
          </select>
        </div>

        <div class="form-group">
          <label class="field-label" for="dagafstand">Gemiddelde afstand per dag</label>
          <select id="dagafstand" name="Dagafstand">
            <option value="10-15 km">10 - 15 km per dag</option>
            <option value="15-20 km" selected>15 - 20 km per dag</option>
            <option value="20-25 km">20 - 25 km per dag</option>
            <option value="25+ km">25+ km per dag</option>
          </select>
        </div>

        <div class="form-group">
          <label class="field-label">Type wandelroute</label>
          <div class="options-grid">
            <label class="option-pill"><input type="radio" name="Route Type" value="Lus (Rondwandeling)" checked> Lus (Rondwandeling)</label>
            <label class="option-pill"><input type="radio" name="Route Type" value="A naar B (Lijnwandeling)"> A naar B (Trekking)</label>
            <label class="option-pill"><input type="radio" name="Route Type" value="Vaste uitvalsbasis"> Vaste uitvalsbasis (Dagtochten)</label>
          </div>
        </div>
      </div>

      <!-- SECTIE 3 -->
      <div class="card">
        <h2 class="card-title">3. Bestemming & Logistiek</h2>

        <div class="form-group">
          <label class="field-label" for="regio">Voorkeur voor regio of land</label>
          <input type="text" id="regio" name="Voorkeur Regio" placeholder="Bijv. Benelux, Eifel, Alpen, Schotland, etc.">
        </div>

        <div class="form-group">
          <label class="field-label">Reistijd & Vervoer</label>
          <div class="options-grid">
            <label class="option-pill"><input type="checkbox" name="Vervoer[]" value="Auto (Max 4u)"> Auto (Max. 4 uur)</label>
            <label class="option-pill"><input type="checkbox" name="Vervoer[]" value="Auto (Max 8u)"> Auto (Max. 8 uur)</label>
            <label class="option-pill"><input type="checkbox" name="Vervoer[]" value="Trein"> Trein</label>
            <label class="option-pill"><input type="checkbox" name="Vervoer[]" value="Vliegen OK"> Vliegen is optie</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label" for="omgeving">Terrein / Omgeving</label>
          <input type="text" id="omgeving" name="Terrein Voorkeur" placeholder="Bijv. Middelgebergte, hooggebergte, kustpaden, bos...">
        </div>
      </div>

      <!-- SECTIE 4 -->
      <div class="card">
        <h2 class="card-title">4. Verblijf, Verzorging & Opmerkingen</h2>

        <div class="form-group">
          <label class="field-label" for="accommodatie">Accommodatie</label>
          <select id="accommodatie" name="Accommodatie">
            <option value="Hotel / B&B / Pension">Hotel / B&B / Pension</option>
            <option value="Gezamenlijk vakantiehuis">Gezamenlijk vakantiehuis</option>
            <option value="Berghutten">Berghutten</option>
            <option value="Camping / Kamperen">Camping / Kamperen</option>
            <option value="Flexibel">Flexibel</option>
          </select>
        </div>

        <div class="form-group">
          <label class="field-label">Lunchvoorkeur onderweg</label>
          <div class="options-grid">
            <label class="option-pill"><input type="radio" name="Lunch" value="Horeca" checked> Horeca op de route</label>
            <label class="option-pill"><input type="radio" name="Lunch" value="Eigen pakket"> Eigen lunchpakket</label>
            <label class="option-pill"><input type="radio" name="Lunch" value="Geen voorkeur"> Geen voorkeur</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label" for="opmerkingen">Extra opmerkingen of specifieke ideeën</label>
          <textarea id="opmerkingen" name="Opmerkingen" rows="3" placeholder="Budgetindicatie, specifieke routes, dieetwensen, etc."></textarea>
        </div>

        <button type="submit">Verstuur reactie</button>
      </div>

    </form>

  </div>

</body>
</html>
